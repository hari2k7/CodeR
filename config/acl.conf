# CodeRank Redis Access Control List (ACL) Configuration
#
# Principle of Least Privilege:
# Creates the dedicated 'app_user' account used by CodeRank backend services.
# Grants access only to application-namespaced keys and safe commands, while
# strictly disabling dangerous administrative commands (-@dangerous).

# Rule Definition:
# user app_user on >AppSecret@2026
#   ~user:* ~problem:* ~submission:* ~submissions* ~contest:* ~tag:* ~difficulty:*
#   ~all:* ~solved:* ~lb:* ~cache:* ~streak:* ~visitors:* ~pending:* ~otp:* ~rl:*
#   ~session:* ~usernames* ~bf:* ~bench:*
#   +@all -@dangerous -@admin -keys

user app_user on >AppSecret@2026 ~user:* ~problem:* ~submission:* ~submissions* ~contest:* ~tag:* ~difficulty:* ~all:* ~solved:* ~lb:* ~cache:* ~streak:* ~visitors:* ~pending:* ~otp:* ~rl:* ~session:* ~usernames* ~bf:* ~bench:* +@all -@dangerous -@admin -keys

# ==============================================================================
# HOW TO APPLY AND TEST THIS ACL IN REDIS:
# ==============================================================================
#
# 1. Dynamically apply the rule to your running Redis instance:
#    redis-cli ACL SETUSER app_user on >AppSecret@2026 ~user:* ~problem:* ~submission:* ~submissions* ~contest:* ~tag:* ~difficulty:* ~all:* ~solved:* ~lb:* ~cache:* ~streak:* ~visitors:* ~pending:* ~otp:* ~rl:* ~session:* ~usernames* ~bf:* ~bench:* +@all -@dangerous -@admin -keys
#
# 2. Verify the user was created:
#    redis-cli ACL LIST
#    redis-cli ACL GETUSER app_user
#
# 3. Test ALLOWED application command as app_user:
#    redis-cli -u redis://app_user:AppSecret@2026@127.0.0.1:6379 ZREVRANGE lb:global 0 5 WITHSCORES
#    (Should return the top 5 competitors)
#
# 4. Test BLOCKED dangerous command as app_user:
#    redis-cli -u redis://app_user:AppSecret@2026@127.0.0.1:6379 FLUSHALL
#    (Expected Error: (error) NOPERM this user has no permissions to run the 'flushall' command)
#
# 5. Test BLOCKED CONFIG command:
#    redis-cli -u redis://app_user:AppSecret@2026@127.0.0.1:6379 CONFIG GET maxmemory
#    (Expected Error: (error) NOPERM this user has no permissions to run the 'config|get' command)
#
# 6. Test BLOCKED KEYS * command (Forces use of SCAN):
#    redis-cli -u redis://app_user:AppSecret@2026@127.0.0.1:6379 KEYS *
#    (Expected Error: (error) NOPERM this user has no permissions to run the 'keys' command)
#
# 7. Test BLOCKED out-of-namespace key access:
#    redis-cli -u redis://app_user:AppSecret@2026@127.0.0.1:6379 GET unauthorized_foreign_key
#    (Expected Error: (error) NOPERM this user has no permissions to access one of the keys used as arguments)
#
# To connect the backend as app_user, set the following in backend/.env:
# REDIS_USERNAME=app_user
# REDIS_PASSWORD=AppSecret@2026
