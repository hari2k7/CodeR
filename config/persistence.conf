# CodeRank Redis Persistence Configuration (RDB + AOF Dual Persistence)
#
# Balances performance, point-in-time recovery, and durability:
# - RDB: Compact point-in-time snapshots for fast disaster recovery.
# - AOF: Append-only log recording every write command with 1-second fsync durability.

# 1. RDB Snapshots (Save points)
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
rdbcompression yes
rdbchecksum yes

# 2. Append-Only File (AOF)
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"

# Fsync Policy:
# 'everysec' guarantees at most 1 second of potential data loss in a hard crash,
# while maintaining near-in-memory throughput.
appendfsync everysec

# Prevent disk I/O bottlenecks during background BGSAVE or BGREWRITEAOF
no-appendfsync-on-rewrite no

# Automatic AOF log compaction
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ==============================================================================
# HOW TO APPLY TO SYSTEM REDIS ON FEDORA (RUN AS ROOT / SUDO):
# ==============================================================================
# Note: On Fedora Linux, Redis system configuration is at /etc/redis/redis.conf
#
# 1. Append these settings to /etc/redis/redis.conf:
#    sudo tee -a /etc/redis/redis.conf << 'EOF'
#    appendonly yes
#    appendfsync everysec
#    EOF
#
# 2. Fix SELinux context & permissions if necessary:
#    sudo restorecon -Rv /var/lib/redis
#    sudo chown -R redis:redis /var/lib/redis
#
# 3. Restart the Redis systemd service:
#    sudo systemctl restart redis
#
# ==============================================================================
# RUNTIME DEMO PROCEDURE (NO SUDO / NO RESTART NEEDED):
# ==============================================================================
# You can enable and test AOF live on the running instance via redis-cli:
#
# 1. Check current persistence status:
#    redis-cli INFO persistence
#
# 2. Enable AOF dynamically without downtime:
#    redis-cli CONFIG SET appendonly yes
#    redis-cli CONFIG SET appendfsync everysec
#
# 3. Trigger manual background rewrite to compact the AOF log:
#    redis-cli BGREWRITEAOF
#
# 4. Write test record:
#    redis-cli SET persistence:test:key "Redis survived reboot"
#
# 5. Force save snapshot:
#    redis-cli BGSAVE
#
# 6. Verify key exists:
#    redis-cli GET persistence:test:key
