# CodeRank Redis Secondary Replica Configuration (Port 6380)
#
# Runs a second Redis instance acting as an asynchronous read-replica of the primary (port 6379).
# Enables read scaling for heavy leaderboard analytical queries and demonstrates replication.

# Network
port 6380
bind 127.0.0.1
protected-mode yes

# Replication Directive: Replicate from primary running on 6379
replicaof 127.0.0.1 6379

# Load modules present on master (required for RDB sync)
loadmodule /usr/lib64/redis/modules/redisbloom.so

# Enforce read-only replica
replica-read-only yes

# Serve stale data during initial synchronization
replica-serve-stale-data yes

# Working directory and operational files (non-root safe)
dir /tmp
pidfile /tmp/redis_replica_6380.pid
logfile /tmp/redis_replica_6380.log
dbfilename dump_6380.rdb

# Persistence disabled on replica for performance (reads only)
save ""
appendonly no

# ==============================================================================
# HOW TO START AND VERIFY REPLICATION LIVE:
# ==============================================================================
#
# 1. Start the replica instance (no sudo required):
#    redis-server config/replica.conf --daemonize yes
#
# 2. Check replica connectivity:
#    redis-cli -p 6380 ping
#    (Expected Output: PONG)
#
# 3. Inspect replication role on primary:
#    redis-cli -p 6379 INFO replication
#    (Shows: role:master, connected_slaves:1, slave0: ip=127.0.0.1,port=6380,state=online)
#
# 4. Inspect replication role on replica:
#    redis-cli -p 6380 INFO replication
#    (Shows: role:slave, master_host:127.0.0.1, master_port:6379, master_link_status:up)
#
# 5. Test real-time data replication:
#    # Write to primary:
#    redis-cli -p 6379 SET repl:demo:key "Hello from primary 6379"
#    # Read from replica:
#    redis-cli -p 6380 GET repl:demo:key
#    (Expected Output: "Hello from primary 6379")
#
# 6. Verify read-only enforcement on replica:
#    redis-cli -p 6380 SET illegal:write "fail"
#    (Expected Output: (error) READONLY You can't write against a read only replica.)
#
# 7. Stop the replica instance when finished:
#    redis-cli -p 6380 shutdown
