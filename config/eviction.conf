# CodeRank Redis Eviction Policy Configuration
#
# Memory Cap and Eviction Policy:
# Protects against Out-Of-Memory (OOM) crashing by establishing a hard memory cap
# and evicting least-recently-used keys when full.

maxmemory 100mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Supported Policies in Redis:
# - noeviction: Return errors when memory limit was reached and client tries to write.
# - allkeys-lru: Evicts least recently used keys out of all keys. (Ideal for CodeRank leaderboard caches)
# - volatile-lru: Evicts least recently used keys among those with an expire set.
# - allkeys-lfu: Evicts least frequently used keys out of all keys.
# - volatile-ttl: Evicts keys with shortest time-to-live first.
# - allkeys-random: Evicts random keys out of all keys.

# ==============================================================================
# HOW TO DEMO MEMORY EVICTION LIVE IN REDIS-CLI:
# ==============================================================================
#
# 1. Inspect current memory usage and policy:
#    redis-cli CONFIG GET maxmemory
#    redis-cli CONFIG GET maxmemory-policy
#    redis-cli INFO memory | grep -E "(used_memory_human|maxmemory_human)"
#
# 2. Configure 100MB limit and allkeys-lru dynamically:
#    redis-cli CONFIG SET maxmemory 100mb
#    redis-cli CONFIG SET maxmemory-policy allkeys-lru
#
# 3. Micro-Demo for quick testing (e.g. 5MB cap):
#    redis-cli CONFIG SET maxmemory 5mb
#    redis-cli CONFIG SET maxmemory-policy allkeys-lru
#
# 4. Fill memory to trigger eviction:
#    # Generate 5,000 keys with 2KB payload:
#    python3 -c "import redis; r = redis.Redis(); [r.set(f'evict_test:{i}', 'X'*2048) for i in range(5000)]"
#
# 5. Observe evicted keys in Redis statistics:
#    redis-cli INFO stats | grep evicted_keys
#    (You will observe evicted_keys > 0 as LRU keys are automatically evicted)
#
# 6. Reset memory policy to unconstrained:
#    redis-cli CONFIG SET maxmemory 0
#    redis-cli CONFIG SET maxmemory-policy noeviction
